name: Validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.10.4'
          python-version: '3.12'
          enable-cache: false
      - run: uvx --from pre-commit==4.7.0 pre-commit run --config .github/pre-commit-config.yml --hook-stage manual --all-files
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.10.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests .github/quality/check.py .github/scripts
      - run: uv run --frozen ruff format --check src tests .github/quality/check.py .github/scripts
      - run: uv run --frozen mypy --strict --no-incremental src/parallel_search_evals
      - run: uv run --frozen python .github/scripts/check_docs.py
      - run: uv run --frozen python .github/quality/check.py --output metrics.json
      - run: uv build
      - run: uv run --frozen python .github/scripts/check_package.py
      - run: uv run --frozen python .github/scripts/check_public.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: review-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.10.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.10.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv run --frozen python .github/scripts/check_dependencies.py
