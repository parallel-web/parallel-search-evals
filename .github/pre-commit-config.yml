repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git --pre-commit --staged --redact=100 --no-banner --verbose
        stages: [pre-commit]
      - id: gitleaks
        alias: gitleaks-checkout
        name: Scan checkout for secrets
        entry: gitleaks dir --redact=100 --no-banner --verbose
        stages: [manual]
      - id: gitleaks
        alias: gitleaks-history
        name: Scan commit history for secrets
        entry: gitleaks git --log-opts=HEAD --redact=100 --no-banner --verbose
        stages: [manual]
